<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="card" id="authCard">
      <div class="brand" aria-hidden="true">A</div>
      <h1 id="title">로그인</h1>

      <form id="authForm">
        <label for="username">아이디</label>
        <input id="username" name="username" autocomplete="username" minlength="3" maxlength="20" required>

        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required>

        <p class="message" id="message" role="alert"></p>
        <button type="submit" id="submitButton">로그인</button>
      </form>

      <p class="switch-text">
        <span id="switchPrompt">계정이 없으신가요?</span>
        <button class="text-button" id="switchButton" type="button">회원가입</button>
      </p>
    </section>

    <section class="card dashboard" id="dashboard" hidden>
      <div class="brand" aria-hidden="true">A</div>
      <p class="eyebrow">환영합니다</p>
      <h1><span id="displayName"></span>님</h1>
      <p class="welcome">로그인에 성공했습니다.</p>
      <button id="logoutButton" type="button">로그아웃</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
